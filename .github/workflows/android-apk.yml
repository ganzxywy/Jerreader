# 手动编出可安装的 Android APK。
#
# 为什么放在云端：本机要装 Android SDK + Gradle 依赖需要几个 GB，而且仓库不携带
# 签名密钥。这个工作流在 GitHub 的 Ubuntu runner 上准备 JDK 17、准备用缓存固定的
# debug keystore、跑共用测试、编出已签名的 APK，然后把它作为 artifact 提供下载。
# 点 Run workflow 即可，不需要克隆之外的任何配置。
#
# 签名身份：仓库的正式分发一直用 debug key（见 docs/MAINTENANCE.md §6）。这里用一份
# 通过 Actions 缓存固定下来的 debug keystore，因此连续多次构建的签名稳定、可以互相
# 覆盖安装。它和作者自己机器上的那份 key 不同，所以与官方 Release APK 之间仍然不能
# 互相覆盖安装。
#
# 注意：本文件刻意不在 steps 的列表项之间写顶格注释。YAML 在列表项之间遇到顶格注释会
# 把序列提前结束，导致 `There's not enough info to determine what you meant` 这类报错。
# 需要说明时写进 run 块内部或文件顶部。
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'androidApp/**'
      - 'core/**'
      - 'ui/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'androidApp/**'
      - 'core/**'
      - 'ui/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          # 版本号来自 version.properties，与 Android 构建读取的是同一个文件。
          versionName=$(sed -n 's/^versionName=//p' version.properties)
          versionCode=$(sed -n 's/^versionCode=//p' version.properties)
          echo "name=$versionName" >> "$GITHUB_OUTPUT"
          echo "code=$versionCode" >> "$GITHUB_OUTPUT"
          echo "Jerreader $versionName ($versionCode)"

      - name: Restore signing keystore
        id: keystore
        uses: actions/cache@v4
        with:
          # keystore 存在缓存里，构建之间的签名身份才稳定；不存在时才新建。
          path: ~/.android/jerreader-ci-debug.keystore
          key: jerreader-ci-debug-keystore

      - name: Create signing keystore when the cache missed
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -keystore "$HOME/.android/jerreader-ci-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point the build at the keystore
        run: |
          # androidApp/build.gradle.kts 读 keystore.properties；文件不在时 release
          # 不签名，Android 会拒绝安装。
          {
            echo "storeFile=$HOME/.android/jerreader-ci-debug.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > keystore.properties

      - name: Run shared and Android unit tests
        run: |
          # 与 scripts/release.sh 相同的顺序：先测共用逻辑与 Android 单测，再出包。
          # 先恢复 gradlew 的可执行位：通过 GitHub 网页上传或 zip 解压得到的仓库
          # 常常丢掉这个权限，直接 ./gradlew 会 Permission denied。
          chmod +x gradlew
          ./gradlew :core:testAndroidHostTest :androidApp:testDebugUnitTest \
            --no-daemon --stacktrace

      - name: Assemble signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed and name it
        id: artifact
        run: |
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "assembleRelease produced no APK" >&2
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" \
            -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          name="Jerreader-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-ci.apk"
          cp "$apk" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jerreader-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-ci
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Jerreader ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }}) CI APK"
            echo ""
            echo '\```'
            echo "file   : ${{ steps.artifact.outputs.path }}"
            echo "sha256 : ${{ steps.artifact.outputs.sha256 }}"
            echo '\```'
            echo ""
            echo "下载：本次运行的 Artifacts → \`Jerreader-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-ci\`。"
            echo ""
            echo "该包用 CI 缓存固定的 debug key 签名，可覆盖安装由本工作流先前构建的版本；"
            echo "与官方 Release APK 的 key 不同，二者之间不能互相覆盖。"
          } >> "$GITHUB_STEP_SUMMARY"
